# Shift-Left DevSecOps pipeline (Fase 2 de la hoja de ruta).
#
# Cuatro escáneres en paralelo (SAST, SCA + contenedor, secretos, dataflow/taint)
# y un job final que consolida sus salidas en un único SARIF (unified/findings.sarif),
# que es la entrada del agente de la Fase 3. Diseño: docs/architecture/pipeline.md.
#
# Ningún job usa secretos, así que el workflow se ejecuta igual en PRs desde forks.
# Las acciones van fijadas por SHA y las imágenes de los escáneres por digest.

name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --config auto requires metrics; --dataflow-traces adds codeFlows to taint findings.
      - name: Scan
        run: |
          mkdir -p results
          semgrep scan --config auto --metrics on --dataflow-traces \
            --sarif --output results/semgrep.sarif .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-semgrep
          path: results/
          retention-days: 30

  codeql:
    name: Dataflow/taint (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          # The default suite leaves out several path-problem queries (e.g. tainted path variants).
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
          output: results/codeql
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-codeql
          path: results/
          retention-days: 30

  trivy-fs:
    name: SCA (Trivy, lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JSON keeps the CVSS vectors (needed for risk prioritisation); SARIF feeds the unified log.
      - name: Scan
        run: |
          mkdir -p results
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            fs --scanners vuln --format json --output results/trivy-fs.json .
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            convert --format sarif --output results/trivy-fs.sarif results/trivy-fs.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-trivy-fs
          path: results/
          retention-days: 30

  trivy-image:
    name: Container (Trivy, Juice Shop image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t tfm/juice-shop:ci src/app/juice-shop
      - name: Scan
        run: |
          mkdir -p results
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            image --scanners vuln --format json --output results/trivy-image.json tfm/juice-shop:ci
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            convert --format sarif --output results/trivy-image.sarif results/trivy-image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-trivy-image
          path: results/
          retention-days: 30

  trufflehog:
    name: Secrets (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --no-verification: verifying would send the benchmark's credentials to third-party APIs.
      # The raw secret is dropped before the result leaves the runner.
      - name: Scan
        run: |
          mkdir -p results
          docker run --rm -v "$PWD:/repo:ro" "$TRUFFLEHOG_IMAGE" \
            filesystem /repo --json --no-verification --no-update \
            --exclude-paths /repo/scripts/pipeline/trufflehog-exclude.txt \
            | jq -c 'del(.Raw, .RawV2)' > results/trufflehog.jsonl
          wc -l results/trufflehog.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-trufflehog
          path: results/
          retention-days: 30

  unify:
    name: Unified findings
    needs: [semgrep, codeql, trivy-fs, trivy-image, trufflehog]
    # Unify whatever finished; the script records which scanners are missing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-*
          path: results
          merge-multiple: true
      - name: Unify
        run: |
          python3 scripts/pipeline/unify_results.py results unified/findings.sarif \
            --repo-root . --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-findings
          path: unified/
          retention-days: 30
