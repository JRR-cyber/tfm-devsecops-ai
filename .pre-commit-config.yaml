# El código de los benchmarks (Juice Shop y los paquetes de SecBench.js) se
# excluye de los hooks que modifican o validan ficheros: es código de terceros
# con fallos intencionados y no debe alterarse (cambiaría la ground truth y
# los partialFingerprints del SARIF).
exclude: ^(src/app/juice-shop/|benchmarks/secbench-js/cases/[^/]+/[^/]+/src/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  # gitleaks no recibe la lista de ficheros de pre-commit (escanea el diff
  # staged), así que su exclusión del benchmark está en .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
